[project]
name = "golfin3d"
version = "0.1.0"
description = "Two-camera golf swing capture with 2D/3D pose, synced to a Foresight GC3"
requires-python = ">=3.10,<3.13"
dependencies = [
  "PySide6>=6.7",
  "opencv-contrib-python>=4.9",
  "mediapipe>=0.10.14",
  "numpy",
  "sounddevice",
]

[project.scripts]
golfin3d = "golfin3d.app:main"

[dependency-groups]
dev = ["pyinstaller>=6.6", "pillow"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
