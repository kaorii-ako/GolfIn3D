name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: dist/GolfIn3D-Setup-Windows-x64.exe
          - os: macos-14
            asset: dist/GolfIn3D-macOS-arm64.dmg
          - os: ubuntu-22.04
            asset: dist/GolfIn3D-Linux-x86_64.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 libegl1 libgles2 libxkbcommon-x11-0 libxcb-cursor0
      - run: uv sync --python 3.12
      - name: Self-checks
        run: |
          uv run python -m golfin3d.pose
          uv run python -m golfin3d.triggers
      - name: Bundle pose models
        shell: bash
        run: |
          mkdir -p golfin3d/models
          for k in lite full; do
            curl -fsSL -o golfin3d/models/pose_landmarker_$k.task \
              https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_$k/float16/latest/pose_landmarker_$k.task
          done
      - run: uv run pyinstaller --noconfirm GolfIn3D.spec
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup --no-progress -y }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=$v" packaging\windows.iss
      - name: macOS disk image
        if: runner.os == 'macOS'
        run: packaging/dmg.sh
      - name: Linux AppImage
        if: runner.os == 'Linux'
        run: packaging/appimage.sh
      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: APPIMAGE_EXTRACT_AND_RUN=1 dist/GolfIn3D-Linux-x86_64.AppImage --selftest
      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        run: dist/GolfIn3D.app/Contents/MacOS/GolfIn3D --selftest
      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process dist\GolfIn3D\GolfIn3D.exe -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "selftest failed: $($p.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}
          path: ${{ matrix.asset }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Checksums
        run: cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.1.0' }}
          name: GolfIn3D ${{ github.ref_type == 'tag' && github.ref_name || 'v0.1.0' }}
          generate_release_notes: true
          files: out/*
